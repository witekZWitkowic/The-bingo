<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d2b"><title>Forest Volunteer Bingo</title><style>
:root{--dark:#102d21;--forest:#1f5a3d;--fern:#a8c47a;--cream:#f5f1df}*{box-sizing:border-box}html{background:var(--dark)}body{min-height:100svh;margin:0;padding:max(7px,env(safe-area-inset-top)) 4px max(10px,env(safe-area-inset-bottom));font-family:Arial,sans-serif;text-align:center;color:#fff;touch-action:manipulation;background:linear-gradient(#08231888,#082318cc),radial-gradient(ellipse at 15% 0,#d3e7aa88 0 5%,transparent 25%),repeating-linear-gradient(100deg,transparent 0 11%,#14442d80 12% 15%,transparent 16% 24%),linear-gradient(145deg,#62864e,#244f37 45%,#102d21);background-attachment:fixed}.app{width:100%;max-width:560px;margin:auto;position:relative}.switch{display:flex;justify-content:center;gap:5px;margin-bottom:4px}.lang{min-width:72px;min-height:34px;padding:5px 10px;border:1.5px solid #ffffffb3;border-radius:999px;background:#f5f1dfea;color:var(--dark);font:700 .8rem Arial;cursor:pointer}.lang[aria-pressed=true]{background:var(--forest);color:#fff;border-color:var(--fern);box-shadow:inset 0 0 0 2px #a8c47a55}.lang:focus-visible,.tile:focus-visible{outline:3px solid #f3d86b;outline-offset:2px}h1{margin:1px 0 3px;font-size:clamp(1.2rem,5.7vw,1.75rem);text-shadow:0 2px 8px #07191155}.intro{margin:0 auto 7px;max-width:42ch;font-size:clamp(.7rem,3vw,.9rem);line-height:1.2}.grid{display:grid;margin-top:50px;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(2px,.8vw,5px)}.tile{appearance:none;position:relative;display:grid;place-items:center;min-width:0;aspect-ratio:1;padding:2px;border:1.5px solid #ffffffb8;border-radius:6px;background:#f9f7e8f5;color:#173d2b;font:600 clamp(7px,2.05vw,12px)/1.04 Arial;overflow:hidden;overflow-wrap:anywhere;hyphens:auto;cursor:pointer;box-shadow:0 2px 6px #07191144;user-select:none}.tile.active{color:#fff;border-color:#cfe6a1;background:linear-gradient(145deg,#2a6843e6,#103926f5);box-shadow:inset 0 0 0 2px #406b38,inset 0 0 0 4px #9dbb6d,0 4px 10px #051a1180;transform:scale(.97)}.tile.active:after{content:'✓';position:absolute;top:1px;right:3px;color:#eff8d7;font-size:clamp(9px,2.7vw,14px)}#popup{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:#051810aa;backdrop-filter:blur(5px);z-index:10}#popup.show{display:grid}.card{width:min(92vw,330px);padding:24px 20px;border:3px solid var(--fern);border-radius:18px;background:var(--cream);color:var(--dark)}#popup h2{margin:0 0 9px;color:var(--forest)}#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:11}@media(min-width:600px){body{padding-top:18px}.grid{gap:6px}.tile{padding:6px;border-radius:10px;line-height:1.12}}
</style></head><body><main class="app"><div class="switch" role="group" aria-label="Language / Język"><button class="lang" data-lang="pl" aria-pressed="false">🇵🇱 PL</button><button class="lang" data-lang="en" aria-pressed="true">🇬🇧 EN</button></div><h1 id="title"></h1><p class="intro" id="intro"></p><div class="grid" id="grid"></div></main><div id="popup" role="dialog" aria-modal="true"><div class="card"><h2 id="winTitle"></h2><p id="timestamp"></p></div></div><canvas id="confetti"></canvas><script>
const tasks=[{"id": 1, "pl": "Opowiedz żart osobie z przeciwnej drużyny.", "en": "Tell a joke to someone from the other team.", "cluster": "Share & connect"}, {"id": 2, "pl": "Dowiedz się, jaki był pierwszy zawód lub pierwsza praca osoby z drugiej drużyny.", "en": "Find out what someone from the other team's first job was.", "cluster": "Get to know"}, {"id": 3, "pl": "Znajdź osobę, która pracuje w PMI dłużej niż Ty.", "en": "Find someone who has worked at PMI longer than you.", "cluster": "Find someone"}, {"id": 4, "pl": "Znajdź osobę, która była w więcej niż 5 krajach.", "en": "Find someone who has visited more than five countries.", "cluster": "Find someone"}, {"id": 5, "pl": "Dowiedz się, jakie hobby ma ktoś z przeciwnej drużyny.", "en": "Find out what hobby someone from the other team has.", "cluster": "Get to know"}, {"id": 6, "pl": "Poznaj imię psa, kota lub innego zwierzaka współpracownika.", "en": "Learn the name of a colleague's dog, cat, or other pet.", "cluster": "Get to know"}, {"id": 7, "pl": "Znajdź osobę, która mieszka najdalej stąd.", "en": "Find the person who lives farthest from here.", "cluster": "Find someone"}, {"id": 8, "pl": "Dowiedz się, jaka jest ulubiona potrawa osoby z drugiej drużyny.", "en": "Find out someone's favorite food from the other team.", "cluster": "Get to know"}, {"id": 9, "pl": "Zrób selfie z osobą, której wcześniej nie znałeś/-aś.", "en": "Take a selfie with someone you did not know before today.", "cluster": "Photo & fun"}, {"id": 10, "pl": "Pomóż komuś przez minimum 5 minut przy wykonywanym zadaniu.", "en": "Help someone with their task for at least five minutes.", "cluster": "Collaborate"}, {"id": 11, "pl": "Zrób wspólne zdjęcie mieszanej grupy, minimum 4 osoby.", "en": "Take a group photo with at least four people from both teams.", "cluster": "Photo & fun"}, {"id": 12, "pl": "Zamień się na chwilę partnerem do pracy z kimś z innej drużyny.", "en": "Switch work partners for a while with someone from the other team.", "cluster": "Collaborate"}, {"id": 13, "pl": "Wymyślcie wspólnie nazwę dla swojej grupy wolontariuszy.", "en": "Come up with a name for your volunteer group together.", "cluster": "Collaborate"}, {"id": 14, "pl": "Zrób zdjęcie pokazujące „największy progres dnia”.", "en": "Take a photo showing the biggest progress of the day.", "cluster": "Photo & fun"}, {"id": 15, "pl": "Znajdź osobę, która ma taki sam kolor butów jak Ty.", "en": "Find someone wearing the same color shoes as you.", "cluster": "Find someone"}, {"id": 16, "pl": "Znajdź kogoś, kto pije kawę bez mleka.", "en": "Find someone who drinks coffee without milk.", "cluster": "Find someone"}, {"id": 17, "pl": "Dowiedz się, kto najwcześniej dziś wstał.", "en": "Find out who woke up the earliest today.", "cluster": "Find someone"}, {"id": 18, "pl": "Znajdź osobę, która ma urodziny w tym samym miesiącu co Ty.", "en": "Find someone whose birthday is in the same month as yours.", "cluster": "Find someone"}, {"id": 19, "pl": "Znajdź kogoś, kto nie lubi grzybów.", "en": "Find someone who does not like mushrooms.", "cluster": "Find someone"}, {"id": 20, "pl": "Znajdź osobę, która potrafi powiedzieć „dzień dobry” w 3 językach.", "en": "Find someone who can say 'good morning' in three languages.", "cluster": "Find someone"}, {"id": 21, "pl": "Opowiedz grupie ciekawostkę o sobie, której większość osób nie zna.", "en": "Tell the group a fun fact about yourself that most people do not know.", "cluster": "Share & connect"}, {"id": 22, "pl": "Poznaj jedną rzecz, którą ktoś chciałby zrobić w ciągu najbliższego roku.", "en": "Find out one thing someone would like to do within the next year.", "cluster": "Get to know"}, {"id": 23, "pl": "Przedstaw sobie dwie osoby, które wcześniej się nie znały.", "en": "Introduce two people who did not know each other before.", "cluster": "Share & connect"}, {"id": 24, "pl": "Zrób najzabawniejsze zdjęcie dnia.", "en": "Take the funniest photo of the day.", "cluster": "Photo & fun"}, {"id": 25, "pl": "Pomóż osobie z drugiej drużyny.", "en": "Help someone from the other team.", "cluster": "Collaborate"}, {"id": 26, "pl": "Poznaj imiona wszystkich osób przy swoim stole podczas grilla.", "en": "Learn the names of everyone at your table during the BBQ.", "cluster": "Share & connect"}, {"id": 27, "pl": "Dowiedz się, jaki był dziecięcy pseudonim jednej osoby.", "en": "Find out what someone's childhood nickname was.", "cluster": "Get to know"}, {"id": 28, "pl": "Znajdź osobę, która ma taki sam ulubiony film lub serial jak Ty.", "en": "Find someone who has the same favorite movie or TV show as you.", "cluster": "Find someone"}, {"id": 29, "pl": "Podziękuj komuś za pomoc przy zadaniu.", "en": "Thank someone for helping with today's volunteer work.", "cluster": "Collaborate"}, {"id": 30, "pl": "Poznaj osobę z grupy wolontariackiej, która pracuje w PMI najkrócej.", "en": "Meet the person from your volontary group who has worked at PMI for the shortest time.", "cluster": "Get to know"}, {"id": 31, "pl": "Znajdź osobę, która lubi ten sam gatunek muzyki co Ty.", "en": "Find someone who enjoys the same music genre as you.", "cluster": "Find someone"}];const N=5,S=25,V='forest-bilingual-v1',GK='board-'+V,SK='state-'+V,WK='win-'+V,LK='lang-'+V;let lang=localStorage.getItem(LK)||'en';const ui={en:{title:'🌲 Volunteer Day Bingo 🌲',intro:'Tap a tile when you complete the task. Get five in a row, column, or diagonal!',board:'Volunteer Day bingo board',win:'🌿 Bingo! 🌿',done:'Completed at'},pl:{title:'🌲 Volunteer Day Bingo 🌲',intro:'Dotknij pola po wykonaniu zadania. Zdobądź pięć pól w rzędzie, kolumnie lub po przekątnej!',board:'Plansza bingo na Dzień Wolontariatu',win:'🌿 Bingo! 🌿',done:'Ukończono'}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function makeBoard(){const g={};tasks.forEach(t=>(g[t.cluster]??=[]).push(t));const names=shuffle(Object.keys(g));names.forEach(n=>g[n]=shuffle(g[n]));let out=[],level=0;while(out.length<S){let added=false;for(const n of names)if(g[n][level]&&out.length<S){out.push(g[n][level].id);added=true}if(!added)break;level++}return shuffle(out)}
function board(){let b=JSON.parse(localStorage.getItem(GK));if(!Array.isArray(b)||b.length!==S||!b.every(id=>tasks.some(t=>t.id===id))){b=makeBoard();localStorage.setItem(GK,JSON.stringify(b));localStorage.removeItem(SK);localStorage.removeItem(WK)}return b}function state(){const s=JSON.parse(localStorage.getItem(SK));return Array.isArray(s)&&s.length===S?s:Array(S).fill(false)}function bingo(s){let l=[];for(let i=0;i<N;i++){l.push(s.slice(i*N,(i+1)*N));l.push(Array.from({length:N},(_,j)=>s[i+j*N]))}l.push(Array.from({length:N},(_,i)=>s[i*(N+1)]));l.push(Array.from({length:N},(_,i)=>s[(i+1)*(N-1)]));return l.some(x=>x.every(Boolean))}
function show(ts){timestamp.textContent=`${ui[lang].done}: ${ts}`;popup.classList.add('show');confetti()}function confetti(){const c=document.querySelector('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let p=Array.from({length:90},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,s:Math.random()*6+3,v:Math.random()*3+2,col:['#d7e7a9','#85ad58','#2f754d','#f3d86b'][Math.floor(Math.random()*4)]})),f=0;(function d(){x.clearRect(0,0,c.width,c.height);p.forEach(a=>{x.fillStyle=a.col;x.fillRect(a.x,a.y,a.s,a.s*.55);a.y+=a.v;if(a.y>c.height)a.y=-8});if(++f<300)requestAnimationFrame(d)})()}
function render(){const b=board(),s=state(),frag=document.createDocumentFragment();b.forEach((id,i)=>{const t=tasks.find(x=>x.id===id),el=document.createElement('button');el.className='tile'+(s[i]?' active':'');el.type='button';el.textContent=t[lang];el.setAttribute('aria-pressed',s[i]);el.onclick=()=>{s[i]=!s[i];el.classList.toggle('active',s[i]);el.setAttribute('aria-pressed',s[i]);localStorage.setItem(SK,JSON.stringify(s));if(bingo(s)&&!localStorage.getItem(WK)){const ts=new Date().toLocaleString(lang==='pl'?'pl-PL':'en-GB');localStorage.setItem(WK,JSON.stringify({timestamp:ts}));setTimeout(()=>show(ts),200)}};frag.append(el)});grid.replaceChildren(frag)}
function setLang(l){lang=l==='pl'?'pl':'en';localStorage.setItem(LK,lang);document.documentElement.lang=lang;document.title='Forest Volunteer Bingo';title.textContent=ui[lang].title;intro.textContent=ui[lang].intro;grid.setAttribute('aria-label',ui[lang].board);winTitle.textContent=ui[lang].win;document.querySelectorAll('.lang').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));render();const w=JSON.parse(localStorage.getItem(WK));if(popup.classList.contains('show')&&w?.timestamp)timestamp.textContent=`${ui[lang].done}: ${w.timestamp}`}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));window.addEventListener('load',()=>{const w=JSON.parse(localStorage.getItem(WK));if(w?.timestamp)setTimeout(()=>show(w.timestamp),200)});setLang(lang);
</script></body></html>
